name: Devcontainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.mise.toml'
      - '.github/workflows/devcontainer.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.mise.toml'
      - '.github/workflows/devcontainer.yaml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Devcontainer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devcontainer CLI
        run: |
          cd .github/devcontainer-ci && npm ci
          echo "$GITHUB_WORKSPACE/.github/devcontainer-ci/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build devcontainer
        run: devcontainer build --workspace-folder .

      - name: Start devcontainer and run tests
        run: |
          # Start the container and capture container ID
          RESULT=$(devcontainer up --workspace-folder . --id-label devcontainer-test=true)
          echo "$RESULT"
          CONTAINER_ID=$(echo "$RESULT" | grep -o '"containerId":"[^"]*"' | cut -d'"' -f4)
          echo "Container ID: $CONTAINER_ID"

          # Exec as the 'vscode' remoteUser in the workspace folder so that
          # mise-managed tools (installed during postCreate under vscode's home)
          # resolve. Raw 'docker exec' would run as root, which has no installs.
          dexec() { docker exec -u vscode -w /workspaces/maxwells-wallet "$CONTAINER_ID" "$@"; }

          echo "Testing mise..."
          dexec mise --version || { echo "mise not found"; exit 1; }

          # Expected versions come from .mise.toml, the single source of truth.
          # Hardcoding them here let the pins drift apart and fail this job
          # whenever .mise.toml was bumped (e.g. node 22 -> 26).
          NODE_WANT=$(sed -nE 's/^node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' .mise.toml)
          PY_WANT=$(sed -nE 's/^python[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' .mise.toml)
          [ -n "$NODE_WANT" ] || { echo "node pin not found in .mise.toml"; exit 1; }
          [ -n "$PY_WANT" ] || { echo "python pin not found in .mise.toml"; exit 1; }

          echo "Testing Node.js (want $NODE_WANT from .mise.toml)..."
          NODE_GOT=$(dexec mise exec -- node --version) || { echo "node not found"; exit 1; }
          echo "$NODE_GOT"
          case "$NODE_GOT" in
            "v$NODE_WANT"|"v$NODE_WANT".*) ;;
            *) echo "Node.js $NODE_WANT expected, got $NODE_GOT"; exit 1 ;;
          esac

          echo "Testing Python (want $PY_WANT from .mise.toml)..."
          PY_GOT=$(dexec mise exec -- python --version) || { echo "python not found"; exit 1; }
          echo "$PY_GOT"
          case "$PY_GOT" in
            "Python $PY_WANT"|"Python $PY_WANT".*) ;;
            *) echo "Python $PY_WANT expected, got $PY_GOT"; exit 1 ;;
          esac

          echo "Testing uv..."
          dexec mise exec -- uv --version || { echo "uv not found"; exit 1; }

          echo "Testing just..."
          dexec mise exec -- just --version || { echo "just not found"; exit 1; }

          echo "Testing gum..."
          dexec mise exec -- gum --version || { echo "gum not found"; exit 1; }

          echo "Testing npm..."
          dexec mise exec -- npm --version || { echo "npm not found"; exit 1; }

          echo "All devcontainer tests passed!"

      - name: Cleanup
        if: always()
        run: |
          docker ps -q --filter "label=devcontainer-test=true" | xargs -r docker stop
          docker ps -aq --filter "label=devcontainer-test=true" | xargs -r docker rm
